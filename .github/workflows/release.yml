name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
      - run: npm run build

      - name: Create zip of dist
        run: zip -j cassettecss-${{ github.ref_name }}.zip dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cassettecss.css
            dist/cassettecss.es.js
            dist/cassettecss.umd.js
            cassettecss-${{ github.ref_name }}.zip
          generate_release_notes: true
